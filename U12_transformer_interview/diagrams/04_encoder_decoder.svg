<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="438" fill="#ffffff" stroke="#2f8f3e" stroke-width="2" rx="6"/>

  <!-- Encoder -->
  <rect x="60" y="60" width="250" height="320" fill="#f4f9ff" stroke="#3366cc" stroke-dasharray="5,4" rx="8"/>
  <text x="185" y="84" text-anchor="middle" font-size="15" fill="#3366cc">Encoder ×N</text>

  <rect x="100" y="100" width="170" height="40" fill="#fff3cd" stroke="#caa000" rx="5"/>
  <text x="185" y="125" text-anchor="middle" font-size="12">输入嵌入 + 位置编码</text>
  <rect x="100" y="160" width="170" height="46" fill="#d6e4ff" stroke="#3366cc" rx="5"/>
  <text x="185" y="182" text-anchor="middle" font-size="12">Multi-Head Self-Attn</text>
  <text x="185" y="198" text-anchor="middle" font-size="10" fill="#888">+ Residual &amp; LayerNorm</text>
  <rect x="100" y="226" width="170" height="46" fill="#e2f0d9" stroke="#5a9e3a" rx="5"/>
  <text x="185" y="248" text-anchor="middle" font-size="12">Feed-Forward (FFN)</text>
  <text x="185" y="264" text-anchor="middle" font-size="10" fill="#888">+ Residual &amp; LayerNorm</text>
  <line x1="185" y1="140" x2="185" y2="160" stroke="#555" marker-end="url(#a4)"/>
  <line x1="185" y1="206" x2="185" y2="226" stroke="#555" marker-end="url(#a4)"/>
  <text x="185" y="320" text-anchor="middle" font-size="11" fill="#777">输出 memory (b, src_len, d_model)</text>

  <!-- Decoder -->
  <rect x="450" y="60" width="250" height="320" fill="#fff6f6" stroke="#cc4444" stroke-dasharray="5,4" rx="8"/>
  <text x="575" y="84" text-anchor="middle" font-size="15" fill="#cc4444">Decoder ×N</text>

  <rect x="490" y="100" width="170" height="40" fill="#fff3cd" stroke="#caa000" rx="5"/>
  <text x="575" y="125" text-anchor="middle" font-size="12">输出嵌入 + 位置编码</text>
  <rect x="490" y="156" width="170" height="44" fill="#ffe0e0" stroke="#cc4444" rx="5"/>
  <text x="575" y="176" text-anchor="middle" font-size="12">Masked Self-Attn</text>
  <text x="575" y="192" text-anchor="middle" font-size="10" fill="#888">+ Res &amp; LN</text>
  <rect x="490" y="214" width="170" height="44" fill="#d6e4ff" stroke="#3366cc" rx="5"/>
  <text x="575" y="234" text-anchor="middle" font-size="12">Cross-Attn (Enc-Dec)</text>
  <text x="575" y="250" text-anchor="middle" font-size="10" fill="#888">Q←Dec, K/V←Enc</text>
  <rect x="490" y="272" width="170" height="40" fill="#e2f0d9" stroke="#5a9e3a" rx="5"/>
  <text x="575" y="296" text-anchor="middle" font-size="12">Feed-Forward (FFN)</text>
  <line x1="575" y1="140" x2="575" y2="156" stroke="#555" marker-end="url(#a4)"/>
  <line x1="575" y1="200" x2="575" y2="214" stroke="#555" marker-end="url(#a4)"/>
  <line x1="575" y1="258" x2="575" y2="272" stroke="#555" marker-end="url(#a4)"/>

  <rect x="490" y="330" width="170" height="36" fill="#f0e6ff" stroke="#7a4fcf" rx="5"/>
  <text x="575" y="353" text-anchor="middle" font-size="12">Linear + Softmax</text>
  <line x1="575" y1="312" x2="575" y2="330" stroke="#555" marker-end="url(#a4)"/>

  <!-- memory -> cross attn -->
  <path d="M270 290 C 360 290, 360 236, 490 236" fill="none" stroke="#3366cc" stroke-width="2" marker-end="url(#a4)"/>
  <text x="380" y="282" text-anchor="middle" font-size="11" fill="#3366cc">memory (K,V)</text>

  <rect x="0" y="408" width="760" height="30" fill="#2f8f3e"/>
  <text x="380" y="428" text-anchor="middle" font-size="12" fill="#fff">Encoder 双向理解；Decoder 自回归生成；Cross-Attn 把源信息引入目标侧</text>
</svg>
