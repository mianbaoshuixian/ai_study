<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="1" y="1" width="758" height="318" fill="#ffffff" stroke="#2f8f3e" stroke-width="2" rx="6"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" fill="#333">Look-Ahead Mask（下三角可见，上三角置 -∞）</text>

  <!-- matrix grid 5x5 -->
  <g transform="translate(250,60)">
    <!-- column headers -->
    <text x="30" y="-8" text-anchor="middle" font-size="11" fill="#777">k1</text>
    <text x="78" y="-8" text-anchor="middle" font-size="11" fill="#777">k2</text>
    <text x="126" y="-8" text-anchor="middle" font-size="11" fill="#777">k3</text>
    <text x="174" y="-8" text-anchor="middle" font-size="11" fill="#777">k4</text>
    <text x="222" y="-8" text-anchor="middle" font-size="11" fill="#777">k5</text>
  </g>
  <g transform="translate(250,60)" font-size="13">
    <!-- rows q1..q5; visible (<=) green, masked (>) gray -->
    <!-- row1 -->
    <rect x="6"  y="6"  width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="28" y="32" text-anchor="middle">✓</text>
    <rect x="54" y="6"  width="44" height="40" fill="#eeeeee" stroke="#bbb"/><text x="76" y="32" text-anchor="middle" fill="#999">-∞</text>
    <rect x="102" y="6" width="44" height="40" fill="#eeeeee" stroke="#bbb"/><text x="124" y="32" text-anchor="middle" fill="#999">-∞</text>
    <rect x="150" y="6" width="44" height="40" fill="#eeeeee" stroke="#bbb"/><text x="172" y="32" text-anchor="middle" fill="#999">-∞</text>
    <rect x="198" y="6" width="44" height="40" fill="#eeeeee" stroke="#bbb"/><text x="220" y="32" text-anchor="middle" fill="#999">-∞</text>
    <!-- row2 -->
    <rect x="6"  y="52" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="28" y="78" text-anchor="middle">✓</text>
    <rect x="54" y="52" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="76" y="78" text-anchor="middle">✓</text>
    <rect x="102" y="52" width="44" height="40" fill="#eeeeee" stroke="#bbb"/><text x="124" y="78" text-anchor="middle" fill="#999">-∞</text>
    <rect x="150" y="52" width="44" height="40" fill="#eeeeee" stroke="#bbb"/><text x="172" y="78" text-anchor="middle" fill="#999">-∞</text>
    <rect x="198" y="52" width="44" height="40" fill="#eeeeee" stroke="#bbb"/><text x="220" y="78" text-anchor="middle" fill="#999">-∞</text>
    <!-- row3 -->
    <rect x="6"  y="98" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="28" y="124" text-anchor="middle">✓</text>
    <rect x="54" y="98" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="76" y="124" text-anchor="middle">✓</text>
    <rect x="102" y="98" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="124" y="124" text-anchor="middle">✓</text>
    <rect x="150" y="98" width="44" height="40" fill="#eeeeee" stroke="#bbb"/><text x="172" y="124" text-anchor="middle" fill="#999">-∞</text>
    <rect x="198" y="98" width="44" height="40" fill="#eeeeee" stroke="#bbb"/><text x="220" y="124" text-anchor="middle" fill="#999">-∞</text>
    <!-- row4 -->
    <rect x="6"  y="144" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="28" y="170" text-anchor="middle">✓</text>
    <rect x="54" y="144" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="76" y="170" text-anchor="middle">✓</text>
    <rect x="102" y="144" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="124" y="170" text-anchor="middle">✓</text>
    <rect x="150" y="144" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="172" y="170" text-anchor="middle">✓</text>
    <rect x="198" y="144" width="44" height="40" fill="#eeeeee" stroke="#bbb"/><text x="220" y="170" text-anchor="middle" fill="#999">-∞</text>
    <!-- row5 -->
    <rect x="6"  y="190" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="28" y="216" text-anchor="middle">✓</text>
    <rect x="54" y="190" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="76" y="216" text-anchor="middle">✓</text>
    <rect x="102" y="190" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="124" y="216" text-anchor="middle">✓</text>
    <rect x="150" y="190" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="172" y="216" text-anchor="middle">✓</text>
    <rect x="198" y="190" width="44" height="40" fill="#e2f0d9" stroke="#5a9e3a"/><text x="220" y="216" text-anchor="middle">✓</text>
  </g>
  <!-- row labels -->
  <g font-size="11" fill="#777" text-anchor="end">
    <text x="244" y="92">q1</text>
    <text x="244" y="138">q2</text>
    <text x="244" y="184">q3</text>
    <text x="244" y="230">q4</text>
    <text x="244" y="276">q5</text>
  </g>
  <text x="120" y="160" font-size="12" fill="#5a9e3a">✓ 可见</text>
  <text x="120" y="182" font-size="12" fill="#999">-∞ 屏蔽未来</text>
  <text x="120" y="210" font-size="11" fill="#777" width="120">softmax 后</text>
  <text x="120" y="226" font-size="11" fill="#777">未来权重→0</text>
</svg>
